services:
  mongodb:
    image: quay.io/mongodb/mongodb-community-server:8.0-ubi9-slim
    container_name: wedding-planner-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mongodb_data:
